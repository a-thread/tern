name: Setup
description: Install Node from .node-version and the npm dependencies. Run after actions/checkout.

inputs:
  ignore-scripts:
    description: Skip install scripts (enough for jobs that only run the eas CLI)
    default: 'false'

runs:
  using: composite
  steps:
    - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
      with:
        node-version-file: '.node-version'
        cache: npm
    - shell: bash
      env:
        IGNORE_SCRIPTS: ${{ inputs.ignore-scripts }}
      run: |
        if [ "$IGNORE_SCRIPTS" = "true" ]; then npm ci --ignore-scripts; else npm ci; fi
