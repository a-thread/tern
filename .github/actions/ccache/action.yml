name: ccache
description: >-
  Android only. Installs ccache and restores the compiler cache, so the build only recompiles the
  C and C++ that changed; build-android turns it on with the CMake launchers. Run it again with
  `save: 'true'` after the build to show stats and save the cache.

inputs:
  save:
    description: "'true' after the build: print stats and, on main, save the cache"
    default: 'false'

runs:
  using: composite
  steps:
    - name: Install ccache
      if: inputs.save != 'true'
      shell: bash
      run: |
        if ! command -v ccache >/dev/null; then
          sudo apt-get install -y ccache || { sudo apt-get update && sudo apt-get install -y ccache; }
        fi
        {
          echo "CCACHE_DIR=$RUNNER_TEMP/ccache"
          echo "CCACHE_MAXSIZE=500M"
          # Ask the compiler for its version, so a new NDK on the runner image starts fresh entries.
          echo "CCACHE_COMPILERCHECK=%compiler% -v"
        } >> "$GITHUB_ENV"
    # The native code comes from node_modules, so one cache per lockfile; only main saves it.
    - id: restore
      if: inputs.save != 'true'
      uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ${{ runner.temp }}/ccache
        key: ccache-android-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
        restore-keys: ccache-android-${{ runner.os }}-
    - if: inputs.save != 'true'
      shell: bash
      env:
        HIT: ${{ steps.restore.outputs.cache-hit }}
      run: |
        echo "CCACHE_EXACT_HIT=$HIT" >> "$GITHUB_ENV"
        ccache --zero-stats

    - if: inputs.save == 'true'
      shell: bash
      run: ccache --show-stats
    - if: >-
        inputs.save == 'true' && env.CCACHE_EXACT_HIT != 'true' &&
        github.ref_name == github.event.repository.default_branch
      uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ${{ runner.temp }}/ccache
        key: ccache-android-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
