name: ccache
description: >-
  Installs ccache and restores main's newest compiler cache for `platform`, so a native build only
  recompiles the C, C++ and Objective-C files that changed. The build step turns it on (USE_CCACHE
  for iOS, the CMake launchers for Android); save the cache afterwards under the `key` output.

inputs:
  platform:
    description: android or ios; each keeps its own cache
    required: true

outputs:
  key:
    description: The key to save the cache under once the build is done
    value: ${{ steps.restore.outputs.cache-primary-key }}

runs:
  using: composite
  steps:
    - name: Install ccache
      shell: bash
      run: |
        if ! command -v ccache >/dev/null; then
          if [ "$RUNNER_OS" = macOS ]; then
            HOMEBREW_NO_AUTO_UPDATE=1 brew install ccache
          else
            sudo apt-get install -y ccache || { sudo apt-get update && sudo apt-get install -y ccache; }
          fi
        fi
        {
          echo "CCACHE_DIR=$RUNNER_TEMP/ccache"
          echo "CCACHE_MAXSIZE=500M"
          # Each runner image installs the NDK and Xcode afresh, so compare compilers by content, not mtime.
          echo "CCACHE_COMPILERCHECK=content"
        } >> "$GITHUB_ENV"
    # Only main saves (releases run there); other refs restore main's newest cache.
    - id: restore
      uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ${{ runner.temp }}/ccache
        key: ccache-${{ inputs.platform }}-${{ runner.os }}-${{ hashFiles('package-lock.json') }}-${{ github.run_id }}
        restore-keys: |
          ccache-${{ inputs.platform }}-${{ runner.os }}-${{ hashFiles('package-lock.json') }}-
          ccache-${{ inputs.platform }}-${{ runner.os }}-
    - shell: bash
      run: ccache --zero-stats
