name: Submit Android
description: >-
  Uploads this run's `android-production` .aab and its R8 mapping.txt straight to Google Play with
  the service account (seconds; no EAS Submit queue). The track comes from eas.json (submit.production.android.track).
  Run after actions/checkout.

inputs:
  service-account-json:
    description: PLAY_SERVICE_ACCOUNT_JSON, the Google Play service account's JSON key
    required: true

runs:
  using: composite
  steps:
    - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
      with:
        name: android-production
        path: dist
    - id: play
      shell: bash
      env:
        SERVICE_ACCOUNT_JSON: ${{ inputs.service-account-json }}
      run: |
        if [ -z "$SERVICE_ACCOUNT_JSON" ]; then
          echo "::error::Add the PLAY_SERVICE_ACCOUNT_JSON secret (the Google Play service account's JSON key)"
          exit 1
        fi
        echo "track=$(node -p "require('./eas.json').submit.production.android.track")" >> "$GITHUB_OUTPUT"
        echo "package=$(node -p "require('./app.json').expo.android.package")" >> "$GITHUB_OUTPUT"
    - uses: r0adkll/upload-google-play@e738b9dd8f2476ea806d921b64aacd24f34515a5 # v1.1.5
      with:
        serviceAccountJsonPlainText: ${{ inputs.service-account-json }}
        packageName: ${{ steps.play.outputs.package }}
        releaseFiles: dist/tern-android.aab
        mappingFile: dist/mapping.txt
        track: ${{ steps.play.outputs.track }}
        status: completed
