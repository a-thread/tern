name: Submit iOS
description: >-
  Uploads the .ipa straight to App Store Connect (and so TestFlight) with `xcrun altool` and an App
  Store Connect API key: a few minutes, with no EAS Submit queue (which took over an hour). macOS
  only, so it runs in the ios job right after build-ios.

inputs:
  ipa:
    description: Path to the .ipa build-ios produced
    required: true
  api-key-id:
    description: ASC_API_KEY_ID, the App Store Connect API key's Key ID
    required: true
  api-issuer-id:
    description: ASC_API_ISSUER_ID, the team's Issuer ID from the same page
    required: true
  api-key-p8:
    description: ASC_API_KEY_P8, the contents of the key's AuthKey_<id>.p8 file
    required: true

runs:
  using: composite
  steps:
    - shell: bash
      env:
        IPA: ${{ inputs.ipa }}
        KEY_ID: ${{ inputs.api-key-id }}
        ISSUER_ID: ${{ inputs.api-issuer-id }}
        KEY_P8: ${{ inputs.api-key-p8 }}
      # release.yml's version job checks the secrets exist, before a macOS runner is spent.
      run: |
        # altool looks for the key here by its id.
        keys="$HOME/.appstoreconnect/private_keys"
        mkdir -p "$keys"
        printf '%s\n' "$KEY_P8" > "$keys/AuthKey_$KEY_ID.p8"
        trap 'rm -f "$keys/AuthKey_$KEY_ID.p8"' EXIT
        xcrun altool --upload-app --type ios --file "$IPA" --apiKey "$KEY_ID" --apiIssuer "$ISSUER_ID"
