name: Build iOS
description: >-
  Builds the production profile with `eas build --local` on a macOS runner (no EAS build quota
  used) and uploads the .ipa as the artifact `ios-production`. Production only: the preview
  profile is ad-hoc signed and installs only on registered devices. Run after actions/checkout.

inputs:
  app-version:
    description: Release version (X.Y.Z) baked into the build; empty keeps app.json's
    default: ''
  expo-token:
    description: EXPO_TOKEN, for the signing credentials and build number
    required: true

runs:
  using: composite
  steps:
    # Pinned so runner image updates don't change the toolchain; bump alongside Expo SDK upgrades.
    - name: Select Xcode
      shell: bash
      run: |
        echo "DEVELOPER_DIR=/Applications/Xcode_26.3.app" >> "$GITHUB_ENV"
        DEVELOPER_DIR=/Applications/Xcode_26.3.app xcodebuild -version
    # Only main saves (releases run there); other refs restore main's newest cache.
    - id: pods-cache
      uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ~/Library/Caches/CocoaPods
        key: pods-${{ runner.os }}-${{ hashFiles('package-lock.json', 'app.json') }}-${{ github.run_id }}
        restore-keys: |
          pods-${{ runner.os }}-${{ hashFiles('package-lock.json', 'app.json') }}-
          pods-${{ runner.os }}-
    - uses: ./.github/actions/setup
    - name: Build
      shell: bash
      env:
        EXPO_TOKEN: ${{ inputs.expo-token }}
        APP_VERSION: ${{ inputs.app-version }}
      run: |
        npx eas build --platform ios --profile production --local --non-interactive \
          --output "$RUNNER_TEMP/tern-ios.ipa"
    - if: github.ref_name == github.event.repository.default_branch
      uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ~/Library/Caches/CocoaPods
        key: ${{ steps.pods-cache.outputs.cache-primary-key }}
    - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
      with:
        name: ios-production
        path: ${{ runner.temp }}/tern-ios.ipa
        retention-days: 5
        if-no-files-found: error
