# Uploads a production build from this run to the store. Runs in the `production` environment.
# - Android: straight to Google Play with the service account (seconds, no EAS Submit queue).
#   The track comes from eas.json (submit.production.android.track).
# - iOS: `eas submit` to TestFlight. Free EAS accounts wait in a queue (25+ minutes at times),
#   hence the long timeout.
name: Submit

on:
  workflow_call:
    inputs:
      platform:
        description: android or ios
        type: string
        required: true
    secrets:
      EXPO_TOKEN:
        required: true
      PLAY_SERVICE_ACCOUNT_JSON:
        required: false

permissions:
  contents: read

jobs:
  submit:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    environment: production
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: ${{ inputs.platform }}-production
          path: dist

      - id: play
        if: inputs.platform == 'android'
        env:
          PLAY_SERVICE_ACCOUNT_JSON: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
        run: |
          if [ -z "$PLAY_SERVICE_ACCOUNT_JSON" ]; then
            echo "::error::Add the PLAY_SERVICE_ACCOUNT_JSON secret (the Google Play service account's JSON key)"
            exit 1
          fi
          echo "track=$(node -p "require('./eas.json').submit.production.android.track")" >> "$GITHUB_OUTPUT"
          echo "package=$(node -p "require('./app.json').expo.android.package")" >> "$GITHUB_OUTPUT"
      - if: inputs.platform == 'android'
        uses: r0adkll/upload-google-play@e738b9dd8f2476ea806d921b64aacd24f34515a5 # v1.1.5
        with:
          serviceAccountJsonPlainText: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
          packageName: ${{ steps.play.outputs.package }}
          releaseFiles: dist/tern-android.aab
          track: ${{ steps.play.outputs.track }}
          status: completed

      # `eas submit` evaluates app.json, which loads the Expo config plugins from node_modules,
      # so the dependencies must be installed. Install scripts aren't needed for that.
      - if: inputs.platform == 'ios'
        uses: ./.github/actions/setup
        with:
          ignore-scripts: 'true'
      - if: inputs.platform == 'ios'
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: npx eas submit --platform ios --profile production --path dist/tern-ios.ipa --non-interactive
