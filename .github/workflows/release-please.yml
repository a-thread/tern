# Keeps a release PR open that bumps the version (package.json, app.json) and CHANGELOG.md from
# conventional commits: fix → patch, feat → minor, feat! → major (minor while below 1.0).
# Merging that PR tags vX.Y.Z and runs release.yml directly; a tag pushed with GITHUB_TOKEN
# wouldn't trigger it.
name: Release Please

on:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: release-please
  cancel-in-progress: false

jobs:
  release-please:
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      pull-requests: write
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
    steps:
      - id: release
        uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0

  release:
    needs: release-please
    if: needs.release-please.outputs.release_created == 'true'
    permissions:
      contents: read
    uses: ./.github/workflows/release.yml
    with:
      tag: ${{ needs.release-please.outputs.tag_name }}
    secrets:
      EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
