# Builds iOS on a macOS runner with `eas build --local` (no EAS build quota used) and uploads
# the .ipa as the artifact `ios-production`. Production only: the preview profile is ad-hoc
# signed and installs only on registered devices.
name: Build iOS

on:
  workflow_call:
    inputs:
      app-version:
        description: Release version (X.Y.Z) baked into the build; empty keeps app.json's
        type: string
        default: ''
    secrets:
      EXPO_TOKEN:
        required: true

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-26
    timeout-minutes: 60
    env:
      # Pinned so runner image updates don't change the toolchain; bump alongside Expo SDK upgrades.
      DEVELOPER_DIR: /Applications/Xcode_26.3.app
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # Only main saves (releases run there); other refs restore main's newest cache.
      - id: pods-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/Library/Caches/CocoaPods
          key: pods-${{ runner.os }}-${{ hashFiles('package-lock.json', 'app.json') }}-${{ github.run_id }}
          restore-keys: |
            pods-${{ runner.os }}-${{ hashFiles('package-lock.json', 'app.json') }}-
            pods-${{ runner.os }}-
      - uses: ./.github/actions/setup
      - run: xcodebuild -version
      - name: Build
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
          APP_VERSION: ${{ inputs.app-version }}
        run: |
          npx eas build --platform ios --profile production --local --non-interactive \
            --output "$RUNNER_TEMP/tern-ios.ipa"
      - if: github.ref_name == github.event.repository.default_branch
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/Library/Caches/CocoaPods
          key: ${{ steps.pods-cache.outputs.cache-primary-key }}
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ios-production
          path: ${{ runner.temp }}/tern-ios.ipa
          retention-days: 5
          if-no-files-found: error
