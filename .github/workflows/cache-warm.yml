# GitHub only shares caches from the default branch with other refs, and releases run on tags.
# This builds on main each week (nothing is submitted) so tag releases restore warm Gradle and
# CocoaPods caches. Free on a public repo.
name: Warm build caches

on:
  schedule:
    - cron: '0 6 * * 1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  android:
    uses: ./.github/workflows/build-android.yml
    with:
      profile: preview
    secrets:
      EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}

  # Production is the only iOS profile CI builds; this uses one EAS build number per run.
  ios:
    if: vars.IOS_RELEASES == 'true'
    uses: ./.github/workflows/build-ios.yml
    secrets:
      EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
