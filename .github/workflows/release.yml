# Release pipeline: checks → build on GitHub runners → submit (after approval).
# Builds use `eas build --local`, so they don't count against the EAS build quota.
# A v* tag releases production; workflow_dispatch builds ad hoc.
name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      profile:
        description: EAS build profile (iOS builds production only)
        type: choice
        options: [preview, production]
        default: preview
      platform:
        description: Platform
        type: choice
        options: [android, ios, all]
        default: android
      submit:
        description: Submit to the store after building (production only; run from a v* tag, the production environment rejects branches)
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  check:
    uses: ./.github/workflows/ci.yml

  version:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Tag must match app.json version
        if: github.event_name == 'push'
        run: |
          expected="v$(node -p "require('./app.json').expo.version")"
          if [ "$GITHUB_REF_NAME" != "$expected" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match app.json version ($expected)"
            exit 1
          fi

  android:
    needs: [check, version]
    if: ${{ github.event_name == 'push' || inputs.platform != 'ios' }}
    uses: ./.github/workflows/build-android.yml
    with:
      profile: ${{ inputs.profile || 'production' }}
    secrets: inherit

  # Tag releases include iOS once the repo variable IOS_RELEASES is 'true' (set after iOS credentials exist in EAS).
  ios:
    needs: [check, version]
    if: ${{ (github.event_name == 'push' && vars.IOS_RELEASES == 'true') || (inputs.platform != 'android' && inputs.profile == 'production') }}
    uses: ./.github/workflows/build-ios.yml
    secrets: inherit

  submit-android:
    needs: android
    if: ${{ github.event_name == 'push' || (inputs.profile == 'production' && inputs.submit) }}
    uses: ./.github/workflows/submit.yml
    with:
      platform: android
    secrets: inherit

  submit-ios:
    needs: ios
    if: ${{ github.event_name == 'push' || (inputs.profile == 'production' && inputs.submit) }}
    uses: ./.github/workflows/submit.yml
    with:
      platform: ios
    secrets: inherit
