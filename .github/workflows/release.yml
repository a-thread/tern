# Continuous release. Every push to main runs the checks; when the commits since the last v* tag
# include a feat or fix, it builds on GitHub runners (`eas build --local`, no EAS build quota),
# uploads to the Play internal track / TestFlight, and only then tags vX.Y.Z with release notes.
# A failed release leaves no tag, so the next merge retries with everything since the last one.
# workflow_dispatch builds an Android preview APK for testing and never submits.
name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# One release at a time. Merges that land meanwhile collapse into the next run, which picks up
# every commit since the last tag.
concurrency:
  group: release-${{ github.event_name }}
  cancel-in-progress: false

jobs:
  check:
    uses: ./.github/workflows/ci.yml

  version:
    runs-on: ubuntu-24.04
    outputs:
      next: ${{ steps.next.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - id: next
        if: github.event_name == 'push'
        run: |
          version="$(bash .github/scripts/next-version.sh)"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          if [ -n "$version" ]; then
            echo "::notice::Releasing v$version"
          else
            echo "::notice::No feat/fix commits since the last release, so nothing to release"
          fi
      - name: iOS submit needs ascAppId
        if: steps.next.outputs.version != '' && vars.IOS_RELEASES == 'true'
        run: |
          asc="$(node -p "require('./eas.json').submit?.production?.ios?.ascAppId ?? ''")"
          if [ -z "$asc" ]; then
            echo "::error::eas.json submit.production.ios.ascAppId is missing; iOS submit can't run non-interactively"
            exit 1
          fi

  android:
    needs: [check, version]
    if: github.event_name == 'workflow_dispatch' || needs.version.outputs.next != ''
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/build-android
        with:
          profile: ${{ github.event_name == 'push' && 'production' || 'preview' }}
          app-version: ${{ needs.version.outputs.next }}
          expo-token: ${{ secrets.EXPO_TOKEN }}

  # Included once the repo variable IOS_RELEASES is 'true' (after iOS credentials exist in EAS).
  ios:
    needs: [check, version]
    if: needs.version.outputs.next != '' && vars.IOS_RELEASES == 'true'
    runs-on: macos-26
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/build-ios
        with:
          app-version: ${{ needs.version.outputs.next }}
          expo-token: ${{ secrets.EXPO_TOKEN }}

  submit-android:
    needs: [version, android]
    if: needs.version.outputs.next != ''
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment: production
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/submit-android
        with:
          service-account-json: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}

  # eas submit waits in the free EAS Submit queue, hence the long timeout.
  submit-ios:
    needs: [version, ios]
    if: needs.version.outputs.next != ''
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    environment: production
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/submit-ios
        with:
          expo-token: ${{ secrets.EXPO_TOKEN }}

  # Tags only after every upload that ran succeeded (iOS counts only when it ran).
  publish:
    needs: [version, submit-android, submit-ios]
    if: >-
      !cancelled() && needs.version.outputs.next != '' &&
      needs.submit-android.result == 'success' &&
      contains(fromJSON('["success", "skipped"]'), needs.submit-ios.result)
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - env:
          GH_TOKEN: ${{ github.token }}
          TAG: v${{ needs.version.outputs.next }}
        run: gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --title "$TAG" --generate-notes
