# Release pipeline: checks → build on GitHub runners → submit (after approval).
# Builds use `eas build --local`, so they don't count against the EAS build quota.
# Production releases come from release-please.yml (workflow_call with the new tag) or a v* tag
# pushed by hand; workflow_dispatch builds ad hoc.
name: Release

on:
  workflow_call:
    inputs:
      tag:
        description: Release tag created by release-please (vX.Y.Z)
        type: string
        required: true
    secrets:
      EXPO_TOKEN:
        required: true
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      profile:
        description: EAS build profile (iOS builds production only)
        type: choice
        options: [preview, production]
        default: preview
      platform:
        description: Platform
        type: choice
        options: [android, ios, all]
        default: android
      submit:
        description: Submit to the store after building (production only; run from a v* tag)
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  check:
    uses: ./.github/workflows/ci.yml

  # Rejects runs that would build for up to an hour and then fail or do nothing.
  preflight:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - env:
          # A workflow_call inherits the caller's push event (on main), so the tag comes from the input.
          EVENT: ${{ github.event_name }}
          TAG: ${{ inputs.tag || github.ref_name }}
          REF_TYPE: ${{ github.ref_type }}
          PROFILE: ${{ inputs.profile }}
          PLATFORM: ${{ inputs.platform }}
          SUBMIT: ${{ inputs.submit }}
          IOS_RELEASES: ${{ vars.IOS_RELEASES }}
        run: |
          fail() { echo "::error::$1"; exit 1; }
          submit_ios=false
          if [ "$EVENT" = "push" ]; then
            expected="v$(node -p "require('./app.json').expo.version")"
            [ "$TAG" = "$expected" ] || fail "Tag $TAG does not match app.json version ($expected)"
            [ "$IOS_RELEASES" = "true" ] && submit_ios=true
          else
            if [ "$PROFILE" = "preview" ]; then
              [ "$PLATFORM" = "ios" ] && fail "iOS builds use the production profile only (preview is ad-hoc signed)"
              [ "$PLATFORM" = "all" ] && echo "::warning::Building Android only: iOS builds use the production profile only"
              [ "$SUBMIT" = "true" ] && fail "Submit needs the production profile"
            fi
            if [ "$SUBMIT" = "true" ]; then
              [ "$REF_TYPE" = "tag" ] || fail "Submit only works when run from a v* tag"
              [ "$PLATFORM" != "android" ] && submit_ios=true
            fi
          fi
          if [ "$submit_ios" = "true" ]; then
            asc="$(node -p "require('./eas.json').submit?.production?.ios?.ascAppId ?? ''")"
            [ -n "$asc" ] || fail "eas.json submit.production.ios.ascAppId is missing; iOS submit can't run non-interactively"
          fi

  android:
    needs: [check, preflight]
    if: ${{ github.event_name == 'push' || inputs.platform != 'ios' }}
    # Per platform, so a submit waiting for approval never blocks the next release's builds.
    concurrency:
      group: release-android
      cancel-in-progress: false
    uses: ./.github/workflows/build-android.yml
    with:
      profile: ${{ inputs.profile || 'production' }}
    secrets:
      EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}

  # Tag releases include iOS once the repo variable IOS_RELEASES is 'true' (set after iOS credentials exist in EAS).
  ios:
    needs: [check, preflight]
    if: ${{ (github.event_name == 'push' && vars.IOS_RELEASES == 'true') || (inputs.platform != 'android' && inputs.profile == 'production') }}
    concurrency:
      group: release-ios
      cancel-in-progress: false
    uses: ./.github/workflows/build-ios.yml
    secrets:
      EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}

  submit-android:
    needs: android
    if: ${{ github.event_name == 'push' || (inputs.profile == 'production' && inputs.submit) }}
    uses: ./.github/workflows/submit.yml
    with:
      platform: android
    secrets:
      EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}

  submit-ios:
    needs: ios
    if: ${{ github.event_name == 'push' || (inputs.profile == 'production' && inputs.submit) }}
    uses: ./.github/workflows/submit.yml
    with:
      platform: ios
    secrets:
      EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
