# Pushes publish feat/fix changes since the last tag; manual runs preview unless `release` is set.
name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      release:
        description: Release to the stores now, even with no app change since the last tag
        type: boolean
        default: false

permissions:
  contents: read

# Serialize releases; the next run picks up commits since the last tag.
concurrency:
  group: release-${{ (github.event_name == 'push' || inputs.release) && 'publish' || 'preview' }}
  cancel-in-progress: false

jobs:
  check:
    uses: ./.github/workflows/ci.yml

  version:
    runs-on: ubuntu-24.04
    outputs:
      next: ${{ steps.next.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - id: next
        if: github.event_name == 'push' || inputs.release
        env:
          FORCE: ${{ inputs.release && '1' || '' }}
        run: |
          version="$(bash .github/scripts/next-version.sh)"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          if [ -n "$version" ]; then
            echo "::notice::Releasing v$version"
          else
            echo "::notice::No feat/fix commits since the last release, so nothing to release"
          fi
      - name: iOS upload needs the App Store Connect key
        if: steps.next.outputs.version != '' && vars.IOS_RELEASES == 'true'
        env:
          ASC_API_KEY_ID: ${{ secrets.ASC_API_KEY_ID }}
          ASC_API_ISSUER_ID: ${{ secrets.ASC_API_ISSUER_ID }}
          ASC_API_KEY_P8: ${{ secrets.ASC_API_KEY_P8 }}
        run: |
          missing=""
          for name in ASC_API_KEY_ID ASC_API_ISSUER_ID ASC_API_KEY_P8; do
            if [ -z "${!name}" ]; then missing="$missing $name"; fi
          done
          if [ -n "$missing" ]; then
            echo "::error::Add the secret(s)$missing (an App Store Connect API key with the App Manager role)"
            exit 1
          fi

  android:
    needs: [check, version]
    if: github.event_name == 'workflow_dispatch' || needs.version.outputs.next != ''
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/build-android
        with:
          profile: ${{ (github.event_name == 'push' || inputs.release) && 'production' || 'preview' }}
          app-version: ${{ needs.version.outputs.next }}
          expo-token: ${{ secrets.EXPO_TOKEN }}

  # Included once the repo variable IOS_RELEASES is 'true' (after iOS credentials exist in EAS).
  # Builds and uploads in one job: altool needs macOS, and a second macOS job would queue for a
  # runner again.
  ios:
    needs: [check, version]
    if: needs.version.outputs.next != '' && vars.IOS_RELEASES == 'true'
    runs-on: macos-26
    timeout-minutes: 60
    environment: production
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/build-ios
        with:
          app-version: ${{ needs.version.outputs.next }}
          expo-token: ${{ secrets.EXPO_TOKEN }}
      - uses: ./.github/actions/submit-ios
        with:
          ipa: ${{ runner.temp }}/tern-ios.ipa
          api-key-id: ${{ secrets.ASC_API_KEY_ID }}
          api-issuer-id: ${{ secrets.ASC_API_ISSUER_ID }}
          api-key-p8: ${{ secrets.ASC_API_KEY_P8 }}

  submit-android:
    needs: android
    if: github.event_name == 'push' || inputs.release
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment: production
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/submit-android
        with:
          service-account-json: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}

  # Publish after uploads succeed; a skipped ios job is allowed, but a failed one is not.
  publish:
    needs: [version, ios, submit-android]
    if: >-
      !cancelled() && needs.version.outputs.next != '' &&
      needs.submit-android.result == 'success' &&
      contains(fromJSON('["success", "skipped"]'), needs.ios.result)
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - env:
          GH_TOKEN: ${{ secrets.RELEASE_TOKEN || github.token }}
          TAG: v${{ needs.version.outputs.next }}
        run: gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --title "$TAG" --generate-notes
