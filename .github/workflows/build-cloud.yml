# Fallback: builds on Expo's servers and counts against the EAS free-tier build quota.
# Regular releases go through release.yml, which builds on GitHub runners instead.
name: Build (EAS cloud)

on:
  workflow_dispatch:
    inputs:
      profile:
        description: EAS build profile
        type: choice
        options: [preview, production]
        default: preview
      platform:
        description: Platform
        type: choice
        options: [android, ios, all]
        default: android
      submit:
        description: Submit to the store after building (production only)
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: build-cloud-${{ github.ref }}
  cancel-in-progress: false

jobs:
  check:
    uses: ./.github/workflows/ci.yml

  build:
    needs: check
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      PROFILE: ${{ inputs.profile }}
      PLATFORM: ${{ inputs.platform }}
      SUBMIT: ${{ inputs.submit }}
      EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup
      - name: Start EAS build
        run: |
          args="--platform $PLATFORM --profile $PROFILE --non-interactive --no-wait"
          if [ "$PROFILE" = "production" ] && [ "$SUBMIT" = "true" ]; then
            args="$args --auto-submit"
          fi
          npx eas build $args
