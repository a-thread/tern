version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly

  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    groups:
      npm-minor-and-patch:
        update-types: [minor, patch]
    # Expo SDK upgrades are done deliberately with `npx expo install --fix`, not by Dependabot.
    ignore:
      - dependency-name: '*'
        update-types: ['version-update:semver-major']
